name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Chronicle News APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias chronicle \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass chronicle123 \
            -keypass chronicle123 \
            -dname "CN=Chronicle News, O=Chronicle Media, C=US"

      - name: Build Android Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ChronicleNews-v1.0.0-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
